server {
    listen 80;

    # Serve the React build
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/ to the backend Kubernetes service.
    # "backend-service" resolves inside the cluster via CoreDNS.
    location /api/ {
        proxy_pass         http://backend-service.employee.svc.cluster.local:8090/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
