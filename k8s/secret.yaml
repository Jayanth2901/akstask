# Replace the base64 values below with real encoded values.
# Encode on PowerShell:  [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("value"))
# Encode on Linux/Mac:   echo -n "value" | base64
#
# MYSQL_HOST     = <your-mysql-server>.mysql.database.azure.com
# MYSQL_DATABASE = employee_db
# MYSQL_USERNAME = mysqladmin
# MYSQL_PASSWORD = <your-strong-password>

apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: employee
type: Opaque
data:
  MYSQL_HOST: <base64-encoded-mysql-hostname>
  MYSQL_DATABASE: <base64-encoded-database-name>
  MYSQL_USERNAME: <base64-encoded-username>
  MYSQL_PASSWORD: <base64-encoded-password>
