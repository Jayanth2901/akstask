# ==========================================
# Application
# ==========================================
spring.application.name=backend

# ==========================================
# MySQL Database
# Reads from environment variables injected by Kubernetes Secret.
# For local development, set these as environment variables or
# override in application-local.properties.
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/employee_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# Server
# ==========================================
server.port=8090

# ==========================================
# Swagger / OpenAPI
# ==========================================
springdoc.swagger-ui.path=/backend
